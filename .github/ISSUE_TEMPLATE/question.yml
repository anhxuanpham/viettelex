name: ❓ Câu hỏi / góp ý khác
description: Không chắc là lỗi, hỏi cách dùng, hoặc góp ý chung
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Nếu app gõ ra chữ sai thì dùng mẫu **🐞 Báo lỗi** — sẽ được xử lý nhanh hơn nhiều.

  - type: checkboxes
    id: checklist
    attributes:
      label: Trước khi gửi
      options:
        - label: Đã đọc [Câu hỏi thường gặp (FAQ)](https://ptrinh.github.io/viettelex/#faq)
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Nền tảng
      description: Bạn đang dùng VietTelex trên nền tảng nào?
      multiple: true
      options:
        - macOS
        - iPhone / iPad
        - Android
        - Windows
        - Linux
        - Web (trang học gõ / JavaScript SDK)
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Câu hỏi
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Phiên bản VietTelex + hệ điều hành
      placeholder: 1.8.3 — macOS 26.1 / 1.2.2 — iOS 27 / 1.1.5 — Windows 11

  - type: textarea
    id: tried
    attributes:
      label: Bạn đã thử những gì
