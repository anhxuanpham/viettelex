name: 🐞 Báo lỗi
description: Gõ ra chữ sai, mất chữ, chữ nhảy, lỗi hiển thị bàn phím, không gõ được trong một app cụ thể…
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Chỉ cần chọn nền tảng + mô tả lỗi. Các mục còn lại **không bắt buộc** — điền được mục nào thì lỗi fix nhanh hơn chừng ấy. Lỗi gõ sai chữ trên macOS: kèm **nhật ký gỡ lỗi** là hầu hết fix được ngay vòng đầu.

        Cách lấy nhật ký: [BAO-LOI.md](https://github.com/ptrinh/viettelex/blob/main/BAO-LOI.md#lấy-nhật-ký-gỡ-lỗi)

  - type: checkboxes
    id: checklist
    attributes:
      label: Trước khi gửi
      options:
        - label: Đã tìm trong [các issue đang mở](https://github.com/ptrinh/viettelex/issues) và không thấy trùng
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Nền tảng
      multiple: true
      options:
        - macOS
        - iPhone / iPad
        - Android
        - Windows
        - Linux
        - Web (trang học gõ)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Mô tả lỗi
      description: Chuyện gì xảy ra, làm thế nào để thấy lỗi. Lỗi hiển thị → kèm ảnh chụp / video quay màn hình (kéo-thả file vào đây).
    validations:
      required: true

  - type: input
    id: app
    attributes:
      label: App / website bị lỗi
      description: Nếu là browser, ghi cả tên website — cơ chế gõ khác nhau giữa address bar và nội dung trang.
      placeholder: Chrome — docs.google.com

  - type: input
    id: keys
    attributes:
      label: Gõ chuỗi phím
      description: Với lỗi gõ ra chữ sai — ghi đúng **phím bấm**, không phải chữ mong muốn.
      placeholder: "theme "

  - type: input
    id: expected
    attributes:
      label: Mong đợi
      placeholder: thêm

  - type: input
    id: actual
    attributes:
      label: Thực tế
      placeholder: themee

  - type: textarea
    id: log
    attributes:
      label: Nhật ký gỡ lỗi (macOS)
      description: |
        Tab **Thử nghiệm** → **Chẩn đoán** → bật **Ghi nhật ký gỡ lỗi** → **Xoá** → tái hiện lỗi → **Chép nhật ký gỡ lỗi** → dán vào đây (log chỉ giữ 2000 dòng gần nhất).

        Nhật ký chỉ ghi sự kiện của bộ gõ, **không ghi nội dung bạn gõ** — và đã có sẵn phiên bản, macOS, cơ chế gõ nên bạn không cần điền tay.
      render: text

  - type: input
    id: version
    attributes:
      label: Phiên bản VietTelex + hệ điều hành
      description: Chỉ cần điền nếu **không** kèm nhật ký ở trên.
      placeholder: 1.5.10 — macOS 26.1 / iOS 1.1.2 — iOS 27
